<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rephraser</title>
    <style>
      body {
        font-family: system-ui, -apple-system, Segoe UI, sans-serif;
        margin: 0;
        padding: 16px;
        background: #f5f5f5;
        color: #222;
      }
      h2 {
        margin: 0 0 12px;
        font-size: 16px;
        color: #555;
      }
      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
      }
      .header h2 {
        margin: 0;
      }
      .box {
        background: #fff;
        border: 1px solid #ddd;
        border-radius: 6px;
        padding: 10px 12px;
        min-height: 60px;
        white-space: pre-wrap;
        font-size: 14px;
        line-height: 1.4;
      }
      textarea.box {
        width: 100%;
        box-sizing: border-box;
        font-family: inherit;
        resize: vertical;
        min-height: 90px;
        outline: none;
      }
      textarea.box:focus {
        border-color: #2563eb;
        box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.15);
      }
      .row {
        display: flex;
        gap: 8px;
        margin: 10px 0 18px;
      }
      button {
        padding: 8px 18px;
        font-size: 14px;
        border-radius: 4px;
        border: 1px solid #888;
        background: #fff;
        cursor: pointer;
      }
      button.primary {
        background: #2563eb;
        color: #fff;
        border-color: #2563eb;
      }
      button.link {
        border: none;
        background: transparent;
        color: #2563eb;
        padding: 4px 6px;
        font-size: 13px;
      }
      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .placeholder {
        color: #999;
      }
      label {
        display: block;
        font-size: 13px;
        color: #555;
        margin: 12px 0 4px;
      }
      input[type="password"],
      input[type="text"],
      select {
        width: 100%;
        padding: 8px 10px;
        font-size: 14px;
        border: 1px solid #ccc;
        border-radius: 4px;
        box-sizing: border-box;
        background: #fff;
      }
      .hint {
        font-size: 12px;
        color: #777;
        margin-top: 4px;
      }
      #error {
        color: #c00;
        margin-top: 8px;
        font-size: 13px;
      }
      .hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <!-- Main view -->
    <div id="main-view" class="hidden">
      <div class="header">
        <h2>Selected text</h2>
        <button id="open-settings" class="link">⚙ Settings</button>
      </div>
      <textarea
        id="captured-text"
        class="box"
        placeholder="Press Ctrl+Alt+J after selecting text in any app — or type/paste text here."
      ></textarea>
      <div class="row">
        <button id="rephrase-btn" class="primary" disabled>Rephrase</button>
      </div>

      <h2>Rephrased</h2>
      <div id="rephrased-text" class="box placeholder">—</div>
      <div class="row">
        <button id="copy-btn" disabled>Copy</button>
        <button id="replace-btn" disabled>Replace</button>
      </div>

      <div id="error"></div>
    </div>

    <!-- Settings view -->
    <div id="settings-view" class="hidden">
      <h2 id="settings-title">Settings</h2>

      <label for="api-key">Gemini API key</label>
      <input
        type="password"
        id="api-key"
        placeholder="AIza..."
        autocomplete="off"
      />
      <div class="hint">
        Get a key at
        <span style="font-family: monospace">aistudio.google.com/apikey</span>.
        Stored locally on this machine.
      </div>

      <label for="model">Model</label>
      <select id="model">
        <option value="gemini-2.5-flash">gemini-2.5-flash (balanced)</option>
        <option value="gemini-2.5-flash-lite">
          gemini-2.5-flash-lite (fastest, cheapest)
        </option>
        <option value="gemini-2.5-pro">
          gemini-2.5-pro (highest quality, slowest)
        </option>
      </select>

      <div class="row" style="margin-top: 18px">
        <button id="save-settings" class="primary">Save</button>
        <button id="cancel-settings">Cancel</button>
      </div>

      <div id="settings-error" class="error" style="color: #c00; font-size: 13px"></div>
    </div>

    <script>
      const mainView = document.getElementById("main-view");
      const settingsView = document.getElementById("settings-view");
      const settingsTitle = document.getElementById("settings-title");

      const capturedEl = document.getElementById("captured-text");
      const rephrasedEl = document.getElementById("rephrased-text");
      const rephraseBtn = document.getElementById("rephrase-btn");
      const copyBtn = document.getElementById("copy-btn");
      const replaceBtn = document.getElementById("replace-btn");
      const errorEl = document.getElementById("error");
      const openSettingsBtn = document.getElementById("open-settings");

      const apiKeyInput = document.getElementById("api-key");
      const modelSelect = document.getElementById("model");
      const saveSettingsBtn = document.getElementById("save-settings");
      const cancelSettingsBtn = document.getElementById("cancel-settings");
      const settingsErrorEl = document.getElementById("settings-error");

      let rephrasedText = "";
      let isFirstRun = false;

      function getCapturedText() {
        return capturedEl.value.trim();
      }

      function refreshRephraseEnabled() {
        rephraseBtn.disabled = !getCapturedText();
      }

      function showMain() {
        settingsView.classList.add("hidden");
        mainView.classList.remove("hidden");
      }

      function showSettings({ initial } = {}) {
        isFirstRun = !!initial;
        settingsTitle.textContent = initial
          ? "Welcome — configure to get started"
          : "Settings";
        cancelSettingsBtn.classList.toggle("hidden", initial);
        settingsErrorEl.textContent = "";
        mainView.classList.add("hidden");
        settingsView.classList.remove("hidden");
        apiKeyInput.focus();
      }

      async function init() {
        const s = await window.electronAPI.getSettings();
        apiKeyInput.value = s.apiKey || "";
        modelSelect.value = s.model || "gemini-2.5-flash";
        if (!s.hasApiKey) {
          showSettings({ initial: true });
        } else {
          showMain();
        }
      }

      function setCaptured(text) {
        capturedEl.value = text || "";
        refreshRephraseEnabled();
        rephrasedText = "";
        rephrasedEl.textContent = "—";
        rephrasedEl.classList.add("placeholder");
        copyBtn.disabled = true;
        copyBtn.textContent = "Copy";
        replaceBtn.disabled = true;
        errorEl.textContent = "";
      }

      capturedEl.addEventListener("input", refreshRephraseEnabled);

      window.electronAPI.onCapturedText((_event, text) => {
        if (settingsView.classList.contains("hidden")) {
          setCaptured(text);
        }
      });

      rephraseBtn.addEventListener("click", async () => {
        const text = getCapturedText();
        if (!text) return;
        errorEl.textContent = "";
        rephraseBtn.disabled = true;
        rephrasedEl.textContent = "Rephrasing…";
        rephrasedEl.classList.add("placeholder");
        try {
          const result = await window.electronAPI.rephrase(text);
          rephrasedText = result || "";
          rephrasedEl.textContent = rephrasedText || "(empty response)";
          rephrasedEl.classList.toggle("placeholder", !rephrasedText);
          copyBtn.disabled = !rephrasedText;
          replaceBtn.disabled = !rephrasedText;
        } catch (e) {
          rephrasedEl.textContent = "—";
          rephrasedEl.classList.add("placeholder");
          errorEl.textContent = e.message || String(e);
        } finally {
          refreshRephraseEnabled();
        }
      });

      copyBtn.addEventListener("click", async () => {
        if (!rephrasedText) return;
        errorEl.textContent = "";
        try {
          await window.electronAPI.copy(rephrasedText);
          copyBtn.textContent = "Copied!";
          setTimeout(() => {
            copyBtn.textContent = "Copy";
          }, 1200);
        } catch (e) {
          errorEl.textContent = e.message || String(e);
        }
      });

      replaceBtn.addEventListener("click", async () => {
        if (!rephrasedText) return;
        errorEl.textContent = "";
        replaceBtn.disabled = true;
        try {
          await window.electronAPI.replace(rephrasedText);
        } catch (e) {
          errorEl.textContent = e.message || String(e);
          replaceBtn.disabled = false;
        }
      });

      openSettingsBtn.addEventListener("click", async () => {
        const s = await window.electronAPI.getSettings();
        apiKeyInput.value = s.apiKey || "";
        modelSelect.value = s.model || "gemini-2.5-flash";
        showSettings();
      });

      saveSettingsBtn.addEventListener("click", async () => {
        const apiKey = apiKeyInput.value.trim();
        const model = modelSelect.value;
        if (!apiKey) {
          settingsErrorEl.textContent = "API key is required.";
          return;
        }
        settingsErrorEl.textContent = "";
        saveSettingsBtn.disabled = true;
        try {
          await window.electronAPI.saveSettings({ apiKey, model });
          showMain();
        } catch (e) {
          settingsErrorEl.textContent = e.message || String(e);
        } finally {
          saveSettingsBtn.disabled = false;
        }
      });

      cancelSettingsBtn.addEventListener("click", () => {
        if (isFirstRun) return; // can't cancel first-run config
        showMain();
      });

      init();
    </script>
  </body>
</html>
